name: Check Appointments

on:
  schedule:
    # Every 30 minutes. GitHub queues cron jobs on a best-effort basis, so
    # runs can be a few minutes late during busy periods.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Never let two checks overlap.
concurrency:
  group: appointment-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Remembers which slots were already emailed so the same opening does not
      # land in your inbox every 30 minutes.
      - name: Restore seen-slots state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: seen-slots-${{ github.run_id }}
          restore-keys: seen-slots-

      - name: Run appointment checker
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python checker.py

      - name: Save seen-slots state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: seen-slots-${{ github.run_id }}

      # Only uploaded when something went wrong, so you can see what the page
      # looked like instead of guessing.
      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: debug_*.png
          if-no-files-found: ignore
          retention-days: 7
